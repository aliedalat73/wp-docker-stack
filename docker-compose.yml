services:
  db:
    image: mariadb:10.11
    container_name: ostureha_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: ostureha_redis
    restart: always
    volumes:
      - redis_data:/data

  wordpress:
    image: wordpress:fpm-alpine
    container_name: ostureha_wordpress
    restart: always
    depends_on:
      - db
      - redis
    volumes:
      - wp_data:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: ostureha_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - wp_data:/var/www/html:ro

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: ostureha_redis_exporter
    restart: always
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: ostureha_nginx_exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx/stub_status
    depends_on:
      - nginx

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ostureha_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'

  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    container_name: ostureha_nginxlog_exporter
    restart: unless-stopped
    command: ["-config-file", "/etc/prometheus-nginxlog-exporter.hcl"]
    volumes:
      - ./nginxlog-config.hcl:/etc/prometheus-nginxlog-exporter.hcl:ro
      - ./logs/nginx:/var/log/nginx:ro
    ports:
      - "4040:4040"

  prometheus:
    image: prom/prometheus:latest
    container_name: ostureha_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.2
    container_name: ostureha_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=https://ostoreha-fardis.ir/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  db_data:
  redis_data:
  wp_data:
  grafana_data:
  prometheus_data:
